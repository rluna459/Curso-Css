<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Enlazando CSS</title>
</head>
<!--
la etiqueta link sirve para enlazar archivos externos al documento html, sin mostrar contenido en la pagina
rel="stylesheet" para indicar que es una hoja de estilo y el rel define la ralcion con el recurso
href indica la ruta del archivo externo ejemplo href="styles.css"
type especifica el tipo de recurso ejeplo type ="text/css"-->
<body>
    <h1>Ingredientes</h1>
    <p>
        <ul>
            <li>Harina</li>
            <li>Carne</li>
            <li>Verduras</li>
            <li class="faltante">Leche</li>
            <li id="ingrediente_secreto">Sal</li>
        </ul>
    </p>

    
</body>
</html>
